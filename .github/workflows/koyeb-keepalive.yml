name: Koyeb Keepalive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request Koyeb ping endpoint
        run: curl --fail --silent --show-error --retry 3 --max-time 30 https://memos-shijl0925-7a7f0c28.koyeb.app/api/ping
